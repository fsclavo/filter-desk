<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="FilterDesk LC filter logo">
  <title>FilterDesk</title>
  <desc>Low-pass L-section: series inductor and shunt capacitor on a navy badge.</desc>

  <rect width="256" height="256" rx="52" ry="52" fill="#12263a"/>

  <!-- faint low-pass response curve (identity nod) -->
  <path d="M28 58 H112 C166 58 178 96 228 96"
        fill="none" stroke="#4cc9f0" stroke-width="12"
        stroke-linecap="round" opacity="0.13"/>

  <!-- signal path: input, series inductor (4 turns), output -->
  <path d="M34 136 H72" fill="none" stroke="#8fd6ef" stroke-width="9"
        stroke-linecap="round"/>
  <path d="M72 136
           a10 10 0 0 1 20 0
           a10 10 0 0 1 20 0
           a10 10 0 0 1 20 0
           a10 10 0 0 1 20 0"
        fill="none" stroke="#4cc9f0" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M152 136 H222" fill="none" stroke="#8fd6ef" stroke-width="9"
        stroke-linecap="round"/>

  <!-- output node -->
  <circle cx="152" cy="136" r="6" fill="#f2f8fc"/>

  <!-- shunt capacitor -->
  <path d="M152 136 V166" fill="none" stroke="#eaf4fb" stroke-width="9"
        stroke-linecap="round"/>
  <path d="M132 166 H172" fill="none" stroke="#f2f8fc" stroke-width="9"
        stroke-linecap="round"/>
  <path d="M132 182 H172" fill="none" stroke="#f2f8fc" stroke-width="9"
        stroke-linecap="round"/>
  <path d="M152 182 V204" fill="none" stroke="#eaf4fb" stroke-width="9"
        stroke-linecap="round"/>

  <!-- ground -->
  <path d="M134 204 H170" fill="none" stroke="#8fd6ef" stroke-width="6"
        stroke-linecap="round"/>
  <path d="M142 212 H162" fill="none" stroke="#8fd6ef" stroke-width="6"
        stroke-linecap="round"/>
  <path d="M149 220 H155" fill="none" stroke="#8fd6ef" stroke-width="6"
        stroke-linecap="round"/>
</svg>
