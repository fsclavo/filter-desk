name: mutation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3
      - name: Install package and dev tools
        run: uv sync --frozen
      - name: Run mutation baseline
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --frozen mutmut run --max-children 2
      - name: Export mutation stats
        run: uv run --frozen mutmut export-cicd-stats
      - uses: actions/upload-artifact@v7
        with:
          name: mutation-stats
          path: mutants/mutmut-cicd-stats.json
