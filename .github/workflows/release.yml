name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04 # glibc 2.35 baseline
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0
      - name: Sync project (frozen)
        run: uv sync --frozen
      - name: Install PyInstaller
        run: uv pip install pyinstaller
      - name: Build onedir bundle
        run: .venv/bin/python -m PyInstaller packaging/filterdesk.spec --noconfirm --distpath dist --workpath build
      - name: Collect third-party licenses
        run: .venv/bin/python packaging/collect_qt_licenses.py dist/FilterDesk
      - name: Smoke test (headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./dist/FilterDesk/FilterDesk --version
      - name: Package tar.gz
        run: tar -C dist -czf FilterDesk-linux-x86_64.tar.gz FilterDesk
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: linux-targz
          path: FilterDesk-linux-x86_64.tar.gz

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync project (frozen)
        run: uv sync --frozen
      - name: Install PyInstaller
        run: uv pip install pyinstaller
      - name: Build onedir bundle
        run: .venv\Scripts\python.exe -m PyInstaller packaging/filterdesk.spec --noconfirm --distpath dist --workpath build
      - name: Collect third-party licenses
        run: .venv\Scripts\python.exe packaging/collect_qt_licenses.py dist/FilterDesk
      - name: Smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: .\dist\FilterDesk\FilterDesk.exe --version
      - name: Package ZIP
        run: Compress-Archive -Path dist/FilterDesk -DestinationPath FilterDesk-windows-x86_64.zip
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-zip
          path: FilterDesk-windows-x86_64.zip
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          if (-not $ver) { $ver = "0.0.0" }
          $root = (Get-Location).Path
          & "C:\Program Files (x86)\NSIS\makensis.exe" `
            "/DVERSION=$ver" `
            "/DSRCDIR=$root\dist\FilterDesk" `
            "/DOUTFILE=$root\FilterDesk-$ver-windows-x86_64-setup.exe" `
            packaging\windows\filterdesk.nsi
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-setup
          path: FilterDesk-*-windows-x86_64-setup.exe

  appimage:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 fuse libfuse2
      - name: Sync project (frozen)
        run: uv sync --frozen
      - name: Install PyInstaller
        run: uv pip install pyinstaller
      - name: Build onedir bundle
        run: .venv/bin/python -m PyInstaller packaging/filterdesk.spec --noconfirm --distpath dist --workpath build
      - name: Build AppImage
        run: bash packaging/appimage/build_appimage.sh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: linux-appimage
          path: FilterDesk-x86_64.AppImage

  release:
    needs: [linux, windows, appimage]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts
      - name: Show artifacts
        run: find artifacts -type f
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3.0.3
        with:
          fail_on_unmatched_files: false
          files: |
            artifacts/linux-targz/FilterDesk-linux-x86_64.tar.gz
            artifacts/linux-appimage/FilterDesk-x86_64.AppImage
            artifacts/windows-setup/FilterDesk-*-windows-x86_64-setup.exe
            artifacts/windows-zip/FilterDesk-windows-x86_64.zip
          generate_release_notes: true
