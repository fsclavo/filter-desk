name: test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install Qt system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3
      - name: Install package and dev tools
        run: uv sync --frozen
      - name: Ruff
        run: uv run --frozen ruff check src tests
      - name: Mypy
        run: uv run --frozen mypy
      - name: Import-linter
        run: uv run --frozen lint-imports
      - name: Pytest (with coverage)
        run: >-
          uv run --frozen pytest -q
          --cov=filterdesk --cov-report=term-missing:skip-covered
          --cov-fail-under=80
        env:
          QT_QPA_PLATFORM: offscreen

  package-smoke:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0
      - name: Sync project (frozen)
        run: uv sync --frozen
      - name: Install PyInstaller
        run: uv pip install pyinstaller
      - name: Build onedir bundle
        run: .venv/bin/python -m PyInstaller packaging/filterdesk.spec --noconfirm --distpath dist --workpath build
      - name: Smoke test (version)
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./dist/FilterDesk/FilterDesk --version
      - name: Smoke test (headless synth)
        run: ./dist/FilterDesk/FilterDesk synthesize --family butterworth --response low_pass --order 3 --cutoff 100M

  spice-validation:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install Qt and ngspice
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 ngspice
      - name: Sync project (frozen)
        run: uv sync --frozen
      - name: SPICE and validation matrix
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          uv run --frozen pytest -q \
            tests/unit/test_spice_mna.py \
            tests/unit/test_spice_export.py \
            tests/unit/test_validation_matrix.py

  gui-stability:
    # Repeat the GUI/worker tests on main to catch nondeterministic Qt/thread
    # problems without slowing down every pull request.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0
      - name: Sync project (frozen)
        run: uv sync --frozen
      - name: GUI stability pass 1
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          timeout 300 uv run --frozen pytest -vv --durations=20 \
            -o faulthandler_timeout=60 \
            tests/unit/test_gui_smoke.py \
            tests/unit/test_gui_qtbot.py \
            tests/unit/test_gui_selectors.py \
            tests/unit/test_marker_drag.py \
            tests/unit/test_marker_retune.py \
            tests/unit/test_spec_panel.py \
            tests/unit/test_worker_lifecycle.py \
            2>&1 | tee gui-pass-1.log
      - name: GUI stability pass 2
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          timeout 300 uv run --frozen pytest -vv --durations=20 \
            -o faulthandler_timeout=60 \
            tests/unit/test_gui_smoke.py \
            tests/unit/test_gui_qtbot.py \
            tests/unit/test_gui_selectors.py \
            tests/unit/test_marker_drag.py \
            tests/unit/test_marker_retune.py \
            tests/unit/test_spec_panel.py \
            tests/unit/test_worker_lifecycle.py \
            2>&1 | tee gui-pass-2.log
      - name: GUI stability pass 3
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          timeout 300 uv run --frozen pytest -vv --durations=20 \
            -o faulthandler_timeout=60 \
            tests/unit/test_gui_smoke.py \
            tests/unit/test_gui_qtbot.py \
            tests/unit/test_gui_selectors.py \
            tests/unit/test_marker_drag.py \
            tests/unit/test_marker_retune.py \
            tests/unit/test_spec_panel.py \
            tests/unit/test_worker_lifecycle.py \
            2>&1 | tee gui-pass-3.log
      - name: Upload GUI stability logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-stability-logs
          path: gui-pass-*.log
          if-no-files-found: ignore
          retention-days: 7
