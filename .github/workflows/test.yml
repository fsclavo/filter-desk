name: test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install Qt system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3
      - name: Install package and dev tools
        run: uv sync --frozen
      - name: Ruff
        run: uv run --frozen ruff check src tests
      - name: Mypy
        run: uv run --frozen mypy
      - name: Import-linter
        run: uv run --frozen lint-imports
      - name: Pytest (with coverage)
        run: >-
          uv run --frozen pytest -q
          --cov=filterdesk --cov-report=term-missing:skip-covered
          --cov-fail-under=80
        env:
          QT_QPA_PLATFORM: offscreen

  package-smoke:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0
      - name: Sync project (frozen)
        run: uv sync --frozen
      - name: Install PyInstaller
        run: uv pip install pyinstaller
      - name: Build onedir bundle
        run: .venv/bin/python -m PyInstaller packaging/filterdesk.spec --noconfirm --distpath dist --workpath build
      - name: Smoke test (version)
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./dist/FilterDesk/FilterDesk --version
      - name: Smoke test (headless synth)
        run: ./dist/FilterDesk/FilterDesk synthesize --family butterworth --response low_pass --order 3 --cutoff 100M
