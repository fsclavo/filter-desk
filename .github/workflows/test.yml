name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install Qt system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3
      - name: Install package and dev tools
        run: uv sync --frozen
      - name: Ruff
        run: uv run --frozen ruff check src tests
      - name: Mypy
        run: uv run --frozen mypy
      - name: Import-linter
        run: uv run --frozen lint-imports
      - name: Pytest (with coverage)
        run: >-
          uv run --frozen pytest -q
          --cov=filterdesk --cov-report=term-missing:skip-covered
          --cov-fail-under=80
        env:
          QT_QPA_PLATFORM: offscreen

  package-smoke:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0
      - name: Sync project (frozen)
        run: uv sync --frozen
      - name: Install PyInstaller
        run: uv pip install pyinstaller
      - name: Build onedir bundle
        run: .venv/bin/python -m PyInstaller packaging/filterdesk.spec --noconfirm --distpath dist --workpath build
      - name: Smoke test (version)
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./dist/FilterDesk/FilterDesk --version
      - name: Smoke test (headless synth)
        run: ./dist/FilterDesk/FilterDesk synthesize --family butterworth --response low_pass --order 3 --cutoff 100M

  package-acceptance-linux:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    timeout-minutes: 45
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install Qt and AppImage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 fuse libfuse2
      - name: Sync project (frozen)
        run: uv sync --frozen
      - name: Install PyInstaller
        run: uv pip install pyinstaller
      - name: Build onedir bundle
        run: .venv/bin/python -m PyInstaller packaging/filterdesk.spec --noconfirm --distpath dist --workpath build
      - name: Collect third-party licenses
        run: .venv/bin/python packaging/collect_qt_licenses.py dist/FilterDesk
      - name: Package tar.gz
        run: tar -C dist -czf FilterDesk-linux-x86_64.tar.gz FilterDesk
      - name: Clean-home bundle self-test
        run: |
          clean="$(mktemp -d)"
          env HOME="$clean" \
            XDG_CONFIG_HOME="$clean/config" \
            XDG_CACHE_HOME="$clean/cache" \
            XDG_DATA_HOME="$clean/data" \
            QT_QPA_PLATFORM=offscreen \
            ./dist/FilterDesk/FilterDesk --self-test
      - name: Build AppImage
        run: bash packaging/appimage/build_appimage.sh
      - name: Clean-home AppImage self-test
        run: |
          clean="$(mktemp -d)"
          env HOME="$clean" \
            XDG_CONFIG_HOME="$clean/config" \
            XDG_CACHE_HOME="$clean/cache" \
            XDG_DATA_HOME="$clean/data" \
            QT_QPA_PLATFORM=offscreen \
            ./FilterDesk-x86_64.AppImage --appimage-extract-and-run --self-test
      - name: Build Debian package
        run: bash packaging/debian/build_deb.sh
      - name: Verify Debian package in a clean container
        run: bash packaging/debian/verify_deb.sh "$(ls FilterDesk-*-amd64.deb)"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: acceptance-linux
          path: |
            FilterDesk-linux-x86_64.tar.gz
            FilterDesk-x86_64.AppImage
            FilterDesk-*-amd64.deb
          retention-days: 7

  package-acceptance-windows:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    timeout-minutes: 45
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync project (frozen)
        run: uv sync --frozen
      - name: Install PyInstaller
        run: uv pip install pyinstaller
      - name: Build onedir bundle
        run: .venv\Scripts\python.exe -m PyInstaller packaging/filterdesk.spec --noconfirm --distpath dist --workpath build
      - name: Collect third-party licenses
        run: .venv\Scripts\python.exe packaging/collect_qt_licenses.py dist/FilterDesk
      - name: Clean-home bundle self-test
        env:
          QT_QPA_PLATFORM: offscreen
        run: .\dist\FilterDesk\FilterDesk.exe --self-test
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          & "C:\Program Files (x86)\NSIS\makensis.exe" `
            "/DVERSION=0.0.0" `
            "/DSRCDIR=$root\dist\FilterDesk" `
            "/DOUTFILE=$root\FilterDesk-acceptance-windows-x86_64-setup.exe" `
            packaging\windows\filterdesk.nsi
      - name: Install, exercise and uninstall the packaged app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = (Get-ChildItem "FilterDesk-*-windows-x86_64-setup.exe" | Select-Object -First 1).FullName
          Start-Process -FilePath $installer -ArgumentList "/S" -Wait
          $exe = Join-Path $env:ProgramFiles "FilterDesk\FilterDesk.exe"
          $uninstaller = Join-Path $env:ProgramFiles "FilterDesk\Uninstall.exe"
          if (-not (Test-Path $exe)) { throw "installed executable missing: $exe" }
          if (-not (Test-Path $uninstaller)) { throw "uninstaller missing: $uninstaller" }
          $desktopLink = Join-Path ([Environment]::GetFolderPath("Desktop")) "FilterDesk.lnk"
          if (-not (Test-Path $desktopLink)) { throw "desktop shortcut missing: $desktopLink" }
          $env:QT_QPA_PLATFORM = "offscreen"
          & $exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "installed app self-test failed: $LASTEXITCODE" }
          Start-Process -FilePath $uninstaller -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 2
          if (Test-Path $exe) { throw "uninstall did not remove $exe" }
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: acceptance-windows
          path: FilterDesk-*-windows-x86_64-setup.exe
          retention-days: 7

  spice-validation:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install Qt and ngspice
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 ngspice
      - name: Sync project (frozen)
        run: uv sync --frozen
      - name: SPICE and validation matrix
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          uv run --frozen pytest -q \
            tests/unit/test_spice_mna.py \
            tests/unit/test_spice_export.py \
            tests/unit/test_validation_matrix.py

  gui-stability:
    # Repeat the GUI/worker tests on main to catch nondeterministic Qt/thread
    # problems without slowing down every pull request.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0
      - name: Sync project (frozen)
        run: uv sync --frozen
      - name: GUI stability pass 1
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          timeout 300 uv run --frozen pytest -vv --durations=20 \
            -o faulthandler_timeout=60 \
            tests/unit/test_gui_smoke.py \
            tests/unit/test_gui_qtbot.py \
            tests/unit/test_gui_selectors.py \
            tests/unit/test_marker_drag.py \
            tests/unit/test_marker_retune.py \
            tests/unit/test_spec_panel.py \
            tests/unit/test_worker_lifecycle.py \
            2>&1 | tee gui-pass-1.log
      - name: GUI stability pass 2
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          timeout 300 uv run --frozen pytest -vv --durations=20 \
            -o faulthandler_timeout=60 \
            tests/unit/test_gui_smoke.py \
            tests/unit/test_gui_qtbot.py \
            tests/unit/test_gui_selectors.py \
            tests/unit/test_marker_drag.py \
            tests/unit/test_marker_retune.py \
            tests/unit/test_spec_panel.py \
            tests/unit/test_worker_lifecycle.py \
            2>&1 | tee gui-pass-2.log
      - name: GUI stability pass 3
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          timeout 300 uv run --frozen pytest -vv --durations=20 \
            -o faulthandler_timeout=60 \
            tests/unit/test_gui_smoke.py \
            tests/unit/test_gui_qtbot.py \
            tests/unit/test_gui_selectors.py \
            tests/unit/test_marker_drag.py \
            tests/unit/test_marker_retune.py \
            tests/unit/test_spec_panel.py \
            tests/unit/test_worker_lifecycle.py \
            2>&1 | tee gui-pass-3.log
      - name: Upload GUI stability logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-stability-logs
          path: gui-pass-*.log
          if-no-files-found: ignore
          retention-days: 7
