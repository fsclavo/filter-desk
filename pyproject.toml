[project]
name = "filterdesk"
version = "0.21.0"
description = "RF filter design, construction and measurement companion for radio amateurs and RF builders"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "FilterDesk contributors" }]
keywords = ["rf", "filter", "synthesis", "microwave", "ham-radio", "amateur-radio", "homebrew", "toroid", "balun", "vna"]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-rf>=1.0",
    "pyside6>=6.6",
    "pyqtgraph>=0.13",
    "matplotlib>=3.8",
]

[project.scripts]
filterdesk = "filterdesk.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filterdesk"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src/filterdesk"]
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["skrf.*", "scipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["PySide6.*", "pyqtgraph.*", "matplotlib.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.9",
    "mypy>=1.14",
    "import-linter>=2.0",
]

[tool.coverage.run]
source = ["filterdesk"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

# Layer/architecture rules enforced in CI (blueprint §12, §28). Run: lint-imports
[tool.importlinter]
root_package = "filterdesk"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain is independent (core has no outbound deps)"
type = "forbidden"
source_modules = ["filterdesk.domain"]
forbidden_modules = [
    "filterdesk.analysis",
    "filterdesk.synthesis",
    "filterdesk.services",
    "filterdesk.gui",
    "filterdesk.io",
    "filterdesk.montecarlo",
    "filterdesk.optimization",
    "filterdesk.components_std",
    "filterdesk.plotting",
]
# Shared analysis DTOs (SweepConfig/SweepSpacing) are used by project persistence;
# moving them into the domain is a future cleanup (blueprint §12).
ignore_imports = ["filterdesk.domain.project -> filterdesk.analysis.types"]

[[tool.importlinter.contracts]]
name = "analysis core does not depend on app/GUI/engines/IO"
type = "forbidden"
source_modules = ["filterdesk.analysis"]
forbidden_modules = [
    "filterdesk.gui",
    "filterdesk.services",
    "filterdesk.synthesis",
    "filterdesk.io",
    "filterdesk.montecarlo",
    "filterdesk.optimization",
]

[[tool.importlinter.contracts]]
name = "synthesis does not depend on app/GUI/IO/MC/optimizer"
type = "forbidden"
source_modules = ["filterdesk.synthesis"]
forbidden_modules = [
    "filterdesk.gui",
    "filterdesk.services",
    "filterdesk.io",
    "filterdesk.montecarlo",
    "filterdesk.optimization",
    "filterdesk.plotting",
]

[[tool.importlinter.contracts]]
name = "montecarlo/optimization are independent engine services"
type = "forbidden"
source_modules = ["filterdesk.montecarlo", "filterdesk.optimization"]
forbidden_modules = [
    "filterdesk.gui",
    "filterdesk.services",
    "filterdesk.synthesis",
]

[[tool.importlinter.contracts]]
name = "only the scikit-rf adapter imports scikit-rf (ADR-001)"
type = "forbidden"
source_modules = ["filterdesk"]
forbidden_modules = ["skrf"]
ignore_imports = ["filterdesk.analysis.adapters.skrf_analyzer -> skrf"]
